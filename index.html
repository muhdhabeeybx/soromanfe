<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Soroman Energy — Operations Portal</title>
    <meta
      name="description"
      content="The operations and finance platform of Soroman Energy Limited: depot inventory, order dispatch, fleet and delivery management, payment reconciliation and reporting."
    />
    <meta name="author" content="Soroman Energy Limited" />
    <meta name="application-name" content="Soroman Energy" />

    <!--
      Staff-only tool behind a login, so there is nothing to rank and a login
      screen in Google is a liability. public/robots.txt says the same thing at
      the crawl level. Flip to "index, follow" only if this ever goes public.
    -->
    <meta name="robots" content="noindex, nofollow" />

    <!--
      favicon.png is the transparent mark. Everything else is flattened onto
      white: iOS renders alpha in a home-screen icon as black.
    -->
    <link rel="icon" type="image/png" sizes="146x136" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Browser UI follows the app's two grounds (--background, src/styles.css) -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Soroman Energy" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Without this iOS turns order numbers and volumes in tables into tel: links -->
    <meta name="format-detection" content="telephone=no,date=no,address=no,email=no" />

    <!--
      Link previews (Slack, WhatsApp, Teams, X). Absolute URLs are mandatory —
      every crawler drops a root-relative og:image. VITE_SITE_URL is substituted
      into these four tags at build time, so the domain lives in exactly one
      place; set it in Netlify > Site configuration > Environment variables.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Soroman Energy" />
    <meta property="og:title" content="Soroman Energy — Operations Portal" />
    <meta
      property="og:description"
      content="The operations and finance platform of Soroman Energy Limited: depot inventory, order dispatch, fleet and delivery management, payment reconciliation and reporting."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Soroman Energy — operations portal for Soroman Energy Limited" />
    <meta property="og:locale" content="en_NG" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@soroman_nigeria" />
    <meta name="twitter:title" content="Soroman Energy — Operations Portal" />
    <meta
      name="twitter:description"
      content="The operations and finance platform of Soroman Energy Limited: depot inventory, order dispatch, fleet and delivery management, payment reconciliation and reporting."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="Soroman Energy — operations portal for Soroman Energy Limited" />

    <!--
      The API is a cold-starting Render service and the login screen calls it
      immediately, so open the connection during HTML parse. Keep the host in
      sync with VITE_API_URL.
    -->
    <link rel="preconnect" href="https://sman-backend.onrender.com" crossorigin />

    <!--
      Paint the right ground on the first frame. layoutStore writes this same
      key; without it a dark-mode user gets a white flash before React mounts.
    -->
    <script>
      try {
        var pref = localStorage.getItem('soroman-theme') || 'system'
        var dark =
          pref === 'dark' ||
          (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {
        /* localStorage unavailable — the store handles it too */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font: 16px/1.6 system-ui, sans-serif; max-width: 32rem; margin: 15vh auto; padding: 0 1.5rem; color: #0a0a0a">
        <h1 style="font-size: 1.25rem; margin: 0 0 0.5rem">Soroman Energy</h1>
        <p style="margin: 0; color: #71717a">
          This portal requires JavaScript. Please enable it in your browser settings and reload
          the page.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
